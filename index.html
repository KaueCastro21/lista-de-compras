<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quicklist - Compras da Semana</title>

    //chamando css.
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="container">
        <div class="brand">quicklist</div>
        <a href="#" class="back-link">← Voltar</a>
        <h1>Compras da semana</h1>

        <form id="item-form" class="input-group">
            <input type="text" id="item-input" placeholder="Adicione seu novo item" required autocomplete="off">
            <button type="submit" class="btn-add">Adicionar item</button>
        </form>

        <ul id="shopping-list" class="shopping-list">
            <!-- Os itens vão aparecer aqui dentro vindos do JavaScript -->
        </ul>

        <div id="delete-alert" class="alert">
            <span>O item foi removido da lista</span>
            <span class="alert-close" id="alert-close-btn">&times;</span>
        </div>
    </div>

    //chama o script que está na pasta js.
    <script src="js/app.js"></script>
</body>
</html>
